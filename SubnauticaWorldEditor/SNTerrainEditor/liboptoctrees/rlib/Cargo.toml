[package]
name = "optoctrees"
edition = "2024"

[lib]
bench = false

[[bench]]
name = "bench"
harness = false

[features]
__bench = []

[dependencies]
bytemuck = { version = "1.25", features = ["derive", "extern_crate_std", "latest_stable_rust"] }
ggmath = { version = "0.18", features = ["bytemuck", "wide"] }
wide = "1.7"

[dependencies.sn-terrain]
git = "https://github.com/Esper89/sn-terrain"
rev = "fdb6b407"
features = ["ffi", "editor"]

[build-dependencies]
build-rs = "0.3"

[dev-dependencies]
criterion = "0.8"
optoctrees = { path = ".", features = ["__bench"] }
rand = "=0.10.3"
